<h2 *ngIf="!matrizForm.get('id')?.value">Nova Matriz Curricular</h2>
<h2 *ngIf="matrizForm.get('id')?.value">Editar Matriz Curricular</h2>

<form [formGroup]="matrizForm" (ngSubmit)="salvar()">
  <label for="cursoId">Curso</label>
  <input type="number" id="cursoId" formControlName="cursoId" required />

  <label for="semestreId">Semestre</label>
  <input type="number" id="semestreId" formControlName="semestreId" required />

  <label for="disciplinaId">Disciplina</label>
  <input type="number" id="disciplinaId" formControlName="disciplinaId" required />

  <label for="ordem">Ordem</label>
  <input type="number" id="ordem" formControlName="ordem" required />

  <button type="submit" [disabled]="matrizForm.invalid">Salvar</button>
</form>
